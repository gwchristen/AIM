# AIM Security Configuration
# This file allows administrators to configure the shared network security path
# without recompiling the application.
#
# INSTRUCTIONS:
# 1. Uncomment the SharedSecurityPath line below
# 2. Replace the path with your network UNC path to the security.config file
# 3. Save this file in the same directory as the AIM executable
#
# EXAMPLE:
# SharedSecurityPath=\\server\share\path\to\AIM\security.config
#
# NOTE: If this file is not present or the SharedSecurityPath is not set,
# the application will fall back to the default masked constant or
# local-only configuration.

